name: Build ObsMCLauncher

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-x86
          - os: windows-latest
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore ObsMCLauncher.Desktop/ObsMCLauncher.Desktop.csproj

    - name: Build
      run: dotnet build ObsMCLauncher.Desktop/ObsMCLauncher.Desktop.csproj -c Release --no-restore

    - name: Publish
      run: dotnet publish ObsMCLauncher.Desktop/ObsMCLauncher.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o ./publish

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.rid == 'win-x64' && 'ObsMCLauncher-CE-Windows-x64' || matrix.rid == 'win-x86' && 'ObsMCLauncher-CE-Windows-x86' || matrix.rid == 'win-arm64' && 'ObsMCLauncher-CE-Windows-ARM64' || matrix.rid == 'linux-x64' && 'ObsMCLauncher-CE-Linux-x64' || matrix.rid == 'linux-arm64' && 'ObsMCLauncher-CE-Linux-ARM64' || matrix.rid == 'osx-x64' && 'ObsMCLauncher-CE-macOS-x64' || matrix.rid == 'osx-arm64' && 'ObsMCLauncher-CE-macOS-ARM64' }}
        path: ./publish