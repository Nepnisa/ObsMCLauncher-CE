name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 推送标签时触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-x86
          - os: windows-latest
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ObsMCLauncher.Desktop/ObsMCLauncher.Desktop.csproj

      - name: Build
        run: dotnet build ObsMCLauncher.Desktop/ObsMCLauncher.Desktop.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish ObsMCLauncher.Desktop/ObsMCLauncher.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Rename and zip
        shell: bash
        run: |
          VERSION=${{ github.ref_name }}
          RID=${{ matrix.rid }}
          case "$RID" in
            win-x64)   PLATFORM="Windows"; ARCH="x64" ;;
            win-x86)   PLATFORM="Windows"; ARCH="x86" ;;
            win-arm64) PLATFORM="Windows"; ARCH="ARM64" ;;
            linux-x64) PLATFORM="Linux";   ARCH="x64" ;;
            linux-arm64) PLATFORM="Linux"; ARCH="ARM64" ;;
            osx-x64)   PLATFORM="macOS";   ARCH="x64" ;;
            osx-arm64) PLATFORM="macOS";   ARCH="ARM64" ;;
          esac
          ZIP_NAME="ObsMCLauncher-CE-${PLATFORM}-${VERSION}-${ARCH}.zip"
          cd ./publish
          zip -r "../${ZIP_NAME}" ./*
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./${{ env.ZIP_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
